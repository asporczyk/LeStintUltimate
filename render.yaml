services:
  - type: web
    name: stint-backend
    env: node
    region: fra
    rootDir: apps/backend
    # --prod=false: NODE_ENV=production would otherwise skip typescript (devDependency) needed by `tsc`
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: node dist/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  - type: web
    name: stint-frontend
    env: static
    region: fra
    rootDir: apps/frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://stint-backend.onrender.com/api
