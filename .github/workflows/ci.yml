name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Real MongoDB for the backend API integration tests (apps/backend/test/api.test.ts)
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (frontend)
        run: pnpm --filter frontend lint

      - name: Tests (unit + API integration)
        run: pnpm test

      - name: Build (typecheck + bundle)
        run: pnpm build
